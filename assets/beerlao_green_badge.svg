<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 140" width="460" height="140">
  <defs>
    <linearGradient id="beerlaoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1a8"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Ribbon Shield -->
  <rect x="10" y="10" width="440" height="120" rx="16" fill="#042010" stroke="url(#beerlaoGold)" stroke-width="2.5"/>
  <rect x="16" y="16" width="428" height="108" rx="12" fill="none" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Left Tiger / Sun Crest -->
  <g transform="translate(30, 22)">
    <circle cx="48" cy="48" r="44" fill="#02140a" stroke="url(#beerlaoGold)" stroke-width="2.5"/>
    <circle cx="48" cy="48" r="38" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3"/>
    
    <!-- Stylized Tiger Head Silhouette / Sun Rays -->
    <path d="M 48 16 L 52 28 L 64 28 L 54 36 L 58 48 L 48 40 L 38 48 L 42 36 L 32 28 L 44 28 Z" fill="url(#beerlaoGold)"/>
    <circle cx="48" cy="56" r="16" fill="url(#emeraldGrad)" stroke="url(#beerlaoGold)" stroke-width="1.5"/>
    <text x="48" y="61" font-family="'Impact', sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">LBC</text>
    <text x="48" y="82" font-family="'Montserrat', sans-serif" font-size="7.5" font-weight="800" fill="url(#beerlaoGold)" text-anchor="middle" letter-spacing="1">SINCE 1973</text>
  </g>

  <!-- Right Typography -->
  <!-- Lao Script: ເບຍລາວ -->
  <text x="145" y="44" font-family="'Noto Sans Lao', 'Saysettha OT', sans-serif" font-weight="800" font-size="20" fill="url(#beerlaoGold)" letter-spacing="1">
    ເບຍລາວ
  </text>

  <!-- BEERLAO Latin Script -->
  <text x="145" y="86" font-family="'Akira Expanded', 'Arial Black', sans-serif" font-weight="900" font-size="38" fill="#ffffff" letter-spacing="2">
    Beerlao
  </text>

  <!-- GREEN Pill Badge -->
  <g transform="translate(325, 52)">
    <rect x="0" y="0" width="105" height="38" rx="8" fill="url(#emeraldGrad)" stroke="url(#beerlaoGold)" stroke-width="2" filter="url(#badgeGlow)"/>
    <text x="52" y="25" font-family="'Akira Expanded', sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      GREEN
    </text>
  </g>

  <!-- Subtitle Tag -->
  <text x="145" y="112" font-family="'Montserrat', sans-serif" font-weight="700" font-size="10.5" fill="#86efac" letter-spacing="3">
    CRISP • REFRESHING • HOM XEBANGFAI RICE
  </text>
</svg>
