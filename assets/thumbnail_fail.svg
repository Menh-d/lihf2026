<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="failBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0e"/>
      <stop offset="50%" stop-color="#050507"/>
      <stop offset="100%" stop-color="#020203"/>
    </linearGradient>
    <pattern id="failGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#failBg)"/>
  <rect width="800" height="450" fill="url(#failGrid)"/>
  
  <!-- Outer Dashed Frame -->
  <rect x="20" y="20" width="760" height="410" rx="14" fill="none" stroke="rgba(239,68,68,0.3)" stroke-width="2" stroke-dasharray="10 6"/>

  <!-- Center Warning Icon -->
  <g transform="translate(400, 160)">
    <circle r="42" fill="rgba(239,68,68,0.08)" stroke="rgba(239,68,68,0.4)" stroke-width="2"/>
    <path d="M -16 12 L 0 -18 L 16 12 Z" fill="none" stroke="#ef4444" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="0" y1="-8" x2="0" y2="2" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="8" r="2" fill="#ef4444"/>
  </g>

  <!-- Headline -->
  <text x="400" y="255" text-anchor="middle" font-family="'Akira Expanded', 'Impact', sans-serif" font-size="28" font-weight="900" fill="#ef4444" letter-spacing="4">
    THUMNAIL FAIL
  </text>

  <!-- Subtitle -->
  <text x="400" y="290" text-anchor="middle" font-family="monospace, sans-serif" font-size="13" font-weight="700" fill="rgba(255,255,255,0.45)" letter-spacing="2">
    [ 3D RENDER PENDING • ASSET IN PRODUCTION ]
  </text>

  <!-- Corner Tech Accents -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="rgba(239,68,68,0.7)" stroke-width="2"/>
  <path d="M 770 50 L 770 30 L 750 30" fill="none" stroke="rgba(239,68,68,0.7)" stroke-width="2"/>
  <path d="M 30 400 L 30 420 L 50 420" fill="none" stroke="rgba(239,68,68,0.7)" stroke-width="2"/>
  <path d="M 770 400 L 770 420 L 750 420" fill="none" stroke="rgba(239,68,68,0.7)" stroke-width="2"/>
</svg>
